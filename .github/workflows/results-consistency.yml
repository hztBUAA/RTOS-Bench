name: results-consistency

on:
  pull_request:
    paths:
      - 'docs/examples/final/**'
      - 'tools/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl python-docx
      - name: 重算并校验分数与汇总表
        run: |
          python3 tools/pipeline.py --version 7load \
            --ssot docs/examples/final/ssot/7load \
            --scored /tmp/scored-7load \
            --out /tmp/out-7load
          diff -r /tmp/scored-7load docs/examples/final/scored/7load
          diff /tmp/out-7load/scores.csv docs/examples/final/outputs/7load/scores.csv
