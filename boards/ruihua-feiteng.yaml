# RTOS-Bench 板卡配置 —— 锐华飞腾派 (Ruihua ReWorks Feiteng, FTE2000 AArch64)
#
# 现场验收(on-site acceptance)统一在测试主控 ccid 上完成,无需串口:
#   ccid = rtos-test-master01  192.168.137.101 (em2)
#     - TFTP 启动文件分发:  /data/tftpboot/aarch64/   (板子 U-Boot 网启动从这里拉镜像)
#     - 结果取回:           anonymous FTP  curl ftp://<board.ip>/rtbench_result.json (二进制,勿用 cat 抓串口)
#     - 编排脚本:           /data/rtbench/scripts/ruihua-feiteng/  (ccid_drive_testall.py 纯网络驱动)
#     - 结果上传:           /data/rtbench/bin/upload_flow_result.py  (读 /data/.env 真实凭证)
#     - 权威 SOP:           /data/rtbench/docs/NETWORK-TOPOLOGY-AND-BOARD-DEBUG.md
#   串口(Windows COM)仅用于:① 改 U-Boot/IP;② OS 硬崩恢复;③ 新板首次带起。
#
# 闭环四步:板上 export -> ccid FTP 取回 -> 转 JUnit XML -> 上传 Flow
#   (Data Process index 返回 HTTP 200 = 结果入库成功;Kamala XML 附件需真实 Flow/LAVA pod)

board:
  name: "Ruihua-Feiteng-FTE2000"
  os: "Ruihua ReWorks 6.1.1"
  arch: "aarch64"

connection:
  type: "telnet"          # ReWorks 控制面 = 裸 TCP :23(无 IAC/无登录),提示符 reworks>
  ip: "192.168.137.210"   # gem0 固化(固件 usrArgs.h GEM0_IPV4_ADDR);改网段需改源码重编
  port: 23
  username: ""            # 无登录
  password: ""

deploy:
  # 飞腾派是 TFTP 网启动静态镜像(非 scp 动态二进制),由 U-Boot bootcmd 拉取:
  mode: "tftp-static-elf"                         # 扩展字段(feiteng 特有)
  tftp_server: "192.168.137.101"                 # = ccid em2
  tftp_files:                                     # 放在 ccid:/data/tftpboot/aarch64/
    - "aarch64/reworks.elf"
    - "aarch64/e2000q-phytiumPi-board.dtb"
  uboot_env:                                      # 已 saveenv 到板子 MMC
    ipaddr: "192.168.137.210"
    netmask: "255.255.255.0"
    gatewayip: "192.168.137.1"
    serverip: "192.168.137.101"
    bootcmd: "tftpboot 0x90000000 aarch64/reworks.elf && tftpboot 0xa0000000 aarch64/e2000q-phytiumPi-board.dtb && bootelf 0x90000000 0xa0000000"

test:
  # 通过 telnet 发裸符号命令(ccid_drive_testall.py 已实现 run + export)
  command: "rtbench_test_all"                     # 已修:4MB 大栈线程 override + argc off-by-one
  export_command: "rtbench_export_result_default" # 写板上 /rtbench_result.json
  end_regex: "reworks>"
  timeout_sec: 600
  workload_allowlist: "all"                        # 飞腾派全 9 负载可真跑(对比 OneOS 哪吒仅白名单)

result:
  remote_path: "/rtbench_result.json"             # 板上(根可 fopen 写,但 opendir / 不可枚举)
  retrieval_method: "ftp"                          # 扩展:anonymous FTP 二进制取回(避开 cat 的 4KB TTY 损坏)
  ftp_url: "ftp://192.168.137.210/rtbench_result.json"
  local_output_dir: "./results/ruihua-feiteng/"
  run_flatten: true                               # 完整结果直传 Data Process 会 400(size),需先 flatten
  run_score: false

flow_upload:                                       # 扩展:结果上传到 Flow 平台
  enabled: true
  data_process_dataset: "performance_safety"      # Data Process index(不校验 podName,自定义 biz_id)
  biz_id_prefix: "rtbench-feiteng"                # 主机侧定时:rtbench-feiteng-<YYYYMMDD_HHMMSS>-testall(板无 RTC)
  kamala_pod_required: true                        # XML 附件腿需真实 Flow/LAVA pod,现场机自定义名会 500
  # 凭证不写此处:由 ccid 的 /data/.env 或仓库根 .env 注入(见 bin/flow.env.example)

firmware_notes:
  # 本板已合入的修复(见 0627/ruihua-feiteng/artifacts/MANIFEST.txt 与 generator/ruihua_entry.c)
  - "rtbench_platform_run_test_all: test-all 跑在 4MB 栈线程,修 Eigen 栈溢出 Data Abort"
  - "rtbench_test_all argc 用 sizeof 修 off-by-one(原 argc=7/argv=6 → strcmp(NULL) 崩)"
  - "test_schedule.c: RUIHUA_PLATFORM 并入 256KB 任务栈分支,消除 0x13005 4MB 软分配失败"
  - "启动只打印挂载信息(rtosbench_boot.c),不自动跑负载"
