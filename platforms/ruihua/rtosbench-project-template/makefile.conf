################################################################################
# RTOS-Bench Makefile Configuration for Ruihua RTOS (ARMv7 SMP)
################################################################################

# Ruihua IDE projects usually keep this file for project-specific toolchain flags.
# The main Makefile owns the RTOS-Bench source list and command framework wiring.

CROSS_PREFIX := gnuarm

CONFIG_COMPLILE_FLAGS += \
	-DRUIHUA_PLATFORM \
	-D__REWORKS__ \
	-I"${REDE_HOME}/user resource/h/vx" \
	-B"$(REDE_HOME)/user resource/fte2000_smp_bsp-32_config/runtimelib/ARMv7_SMP/lib" \
	-D__multi_core__ \
	-D_IMX6Q_ \
	-DUSE_REWORKS_IPNET_69 \
	-I"${REDE_HOME}/resource/h" \
	-I"${REDE_HOME}/user resource/h/io" \
	-B"$(REDE_HOME)/user resource/armv7_smp_csp_config/runtimelib/ARMv7_SMP/lib" \
	-I"$(REDE_HOME)/resource/h/arch/ARMv7_SMP" \
	-I"${REDE_HOME}/user resource/h/symtbl" \
	-I"$(REDE_HOME)/user resource/fte2000_smp_bsp-32_config/runtimelib/h"

CONFIG_LINK_DYNAMIC_FLAGS +=

CPPFLAGS += \
	-I"$(REDE_HOME)/user resource/fte2000_smp_bsp-32_config/runtimelib/h"
