schema_version: "1.0"
updated_at: "2026-07-17"
description: >-
  Static hardware profiles for the fixed RTOS-Bench board inventory. These
  profiles are intended for portal display and result enrichment. Values under
  instance_overrides must be confirmed on the actual DUT when the product has
  multiple SKUs or replaceable components.

usage:
  join_key: board_id
  result_precedence:
    - "Use non-empty runtime values from rtbench_result.json when trustworthy."
    - "Otherwise fall back to the static profile in this file."
    - "Never infer physical connector counts from SoC capabilities."
  scopes:
    board: "Physical board/system information exposed to users."
    soc: "Processor-integrated capabilities; not all are necessarily routed on the board."
    instance: "Configuration of the concrete DUT, such as installed RAM or CPU model."

