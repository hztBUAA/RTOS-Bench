# RTOS-Bench 远程测试板卡配置示例
# 用法：复制为 board.yaml，按实际环境填写，然后执行
#   python utils/remote-test/deploy.py -c board.yaml
# 字段说明见 docs/SOP.md 的「配置文件」一节。
# 各板卡现成配置见 utils/remote-test/boards/。

board:
  name: "LS2K1000LA"          # 板卡名，用于输出目录名
  os: "SylixOS"               # 被测操作系统
  arch: "loongarch64"         # loongarch64 | aarch64 | x86_64 | riscv64

connection:
  # ssh / telnet：填 ip、port、username、password
  # serial：填 device、baudrate，不要填 ip
  type: "ssh"
  ip: "192.168.137.200"       # 赛迪内网示例地址
  port: 22                    # FRP 或端口映射场景填实际端口
  username: "root"
  password: "root"

deploy:
  # 不填 local_binary，或执行时加 --skip-deploy，可跳过上传
  local_binary: "./rtbench"          # 本机编译产物
  remote_dir: "/apps/rtosbench/"     # 板上目标目录

# 只开放 telnet 的板卡用 FTP 上传。SSH 连接不需要本节。
# ftp:
#   enabled: true
#   port: 21

test:
  # 默认 7 个工业负载。test-schedule 默认 cycles=3。
  # 快速冒烟可改用：./rtbench test-all --quick
  command: "cd /apps/rtosbench && ./rtbench test-all -o /apps/rtosbench/rtbench_result.json"
  # 结束标志必须与代码输出一致。
  # 旧值 "[result-export] JSON result saved" 已失效，会导致等待超时。
  end_regex: "\\[RTOS-Bench\\] Results saved to:"
  # 7 负载全量 test-all 在慢板卡上耗时较长，建议不小于 3600。
  timeout_sec: 3600

result:
  # remote_path 必须与 test.command 中 -o 的路径一致
  remote_path: "/apps/rtosbench/rtbench_result.json"
  local_output_dir: "./results/"
  retrieval_method: "sftp"           # sftp | terminal_capture
  run_flatten: true                  # 生成 standard_results.json
  run_score: false                   # 生成 score_report.json
