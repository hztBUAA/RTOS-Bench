# 板卡：锐华-飞腾派
# 系统：ReWorks    架构：aarch64
# 网络：192.168.137.210（原内网 192.168.31.210）
# 连接：telnet 23。ReWorks shell 提示符为 reworks>。
# 结果：terminal_capture。命令末尾打印 JSON 与结束标记。
# 状态：待确认。ReWorks shell 的命令分隔符、模块名与 cat 支持需现场核对。
#       若 shell 只接受单条命令，请拆成多条发送或在板端写成脚本。
# 前置：模块已在 /apps/rtosbench/。需要自动上传时，取消下面 ftp 注释。
#
# ftp:
#   enabled: true
#   port: 21

board:
  name: "锐华-飞腾派"
  os: "ReWorks"
  arch: "aarch64"

connection:
  type: "telnet"
  ip: "192.168.137.210"
  port: 23
  username: "root"
  password: "root"

deploy:
  # local_binary: "./build/reworks_feiteng/rtbench.out"
  remote_dir: "/apps/rtosbench/"

test:
  # 模块名 rtbench.out 与命令名 rtbench 需按实际产物修改。
  # 快速冒烟用 --quick。验收全量去掉 --quick。
  command: "ld \"/apps/rtosbench/rtbench.out\" ; rtbench test-all --quick -o /apps/rtosbench/rtbench_result.json ; cat /apps/rtosbench/rtbench_result.json ; echo RT-JSON-END"
  end_regex: "\\nRT-JSON-END\\r?\\n"
  timeout_sec: 3600

result:
  remote_path: "/apps/rtosbench/rtbench_result.json"
  local_output_dir: "./results/reworks_feiteng/"
  retrieval_method: "terminal_capture"
  run_flatten: true
  run_score: false
