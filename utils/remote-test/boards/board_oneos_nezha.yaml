# 板卡：OneOS-哪吒（D1H）
# 系统：OneOS    架构：riscv64
# 网络：192.168.137.211（原内网 192.168.31.211）
# 状态：未验证，不可直接用于验收。
# 已知：模块 printf 多走串口，telnet 可能看不到测试输出。
# 已知：/user/schedrun.out 只跑 test-schedule，不产出 rtbench_result.json。
#       自动取回与展平暂不可用。
# 参考：platforms/oneos/0627-acceptance/RESULT.md

board:
  name: "OneOS-哪吒"
  os: "OneOS"
  arch: "riscv64"

connection:
  type: "telnet"
  ip: "192.168.137.211"
  port: 23
  username: "root"
  password: "root"

deploy:
  remote_dir: "/user"

test:
  command: "ld /user/schedrun.out"
  end_regex: "(?i)final score"
  timeout_sec: 1800

result:
  remote_path: "/user/rtbench_result.json"
  local_output_dir: "./results/oneos_nezha/"
  retrieval_method: "terminal_capture"
  run_flatten: false
  run_score: false
