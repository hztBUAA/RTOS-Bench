# 板卡：OneOS-飞腾（Phytium E2000Q）
# 系统：OneOS    架构：aarch64
# 网络：192.168.137.214（原内网 192.168.31.205）
# 连接：telnet 23。OneOS 不提供 SSH。
# 结果：terminal_capture。命令末尾打印 JSON 与结束标记。
# 状态：待现场确认。模块名取自 platforms/oneos/README.md。
#       需确认该板模块日志是否走 telnet。若走串口，terminal_capture 取不到结果。
# 前置：模块 /user/phytium_pi_out.out 已在板上。
#       若不在，用 OneOS 官方 tftp_client 上传。

board:
  name: "OneOS-飞腾"
  os: "OneOS"
  arch: "aarch64"

connection:
  type: "telnet"
  ip: "192.168.137.214"
  port: 23
  username: "root"
  password: "root"

deploy:
  remote_dir: "/user"

test:
  command: "ld /user/phytium_pi_out.out ; rtbench test-all --quick -o /user/rtbench_result.json ; cat /user/rtbench_result.json ; echo RT-JSON-END"
  end_regex: "\\nRT-JSON-END\\r?\\n"
  timeout_sec: 3600

result:
  remote_path: "/user/rtbench_result.json"
  local_output_dir: "./results/oneos_feiteng/"
  retrieval_method: "terminal_capture"
  run_flatten: true
  run_score: false
