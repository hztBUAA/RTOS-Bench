# 板卡：东土-工控机
# 系统：Intewell    宿主架构：x86_64；RTOS 分区：i386/32 位（ARCH=_X86_）
# 网络（赛迪内网）：测试面 vm1 = 192.168.137.215（原内网 192.168.31.206）
# 管理页：http://127.0.0.1:5556
#   ssh -L 5556:192.168.31.240:5556 rtbench@10.134.151.45 -p 1026  (密码 rtbench)
# 镜像上传：管理页 -> 实时虚拟机 -> rtos_bench -> 镜像 -> 上传
#   build/dongtu_x86/rtosbench_x86/Debug/make/rtosbench_x86.bin -> 生效
# 连接：telnet 23（连的是测试面 vm1，不是管理页）。
# 结果：terminal_capture。命令末尾打印 JSON 与结束标记。
# 状态：构建/链接已验证；上板二进制名、/apps 可写性与 cat 支持待现场核对。
# 前置：镜像已上传并生效；rtbench 是由 shell.c 注册的 shell 命令，不是文件。
#       需要自动上传时，取消下面 ftp 注释（镜像仍建议走管理页）。
#
# ftp:
#   enabled: true
#   port: 21

board:
  name: "东土-工控机"
  os: "Intewell"
  arch: "x86"          # 宿主 x86_64；被测 RTOS 分区是 32 位 i386

connection:
  type: "telnet"
  ip: "192.168.137.215"
  port: 23
  username: "root"
  password: "root"

deploy:
  # local_binary: "./build/intewell_gongkong/rtbench"
  remote_dir: "/apps/rtosbench/"

test:
  # 这是 Intewell shell 命令，不是文件；验收全量不要加 --quick。
  # 快速冒烟：rtbench test-all --quick -o /tmp/rtbench_result.json ; cat /tmp/rtbench_result.json
  command: "rtbench test-all -o /apps/rtosbench/rtbench_result.json ; cat /apps/rtosbench/rtbench_result.json ; echo RT-JSON-END"
  end_regex: "\\nRT-JSON-END\\r?\\n"
  timeout_sec: 3600

result:
  remote_path: "/apps/rtosbench/rtbench_result.json"
  local_output_dir: "./results/intewell_gongkong/"
  retrieval_method: "terminal_capture"
  run_flatten: true
  run_score: false
