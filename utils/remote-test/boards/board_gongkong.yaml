# RTOS-Bench 翼辉工控机 (MH7700) 开发板配置
board:
  name: "MH7700-SylixOS"
  os: "SylixOS"
  arch: "x86_64"
  description: "翼辉科技 MH7700 工控机"

# 正确的连接方式: 通过SSH跳板机 -> Telnet到内网
jumphost:
  host: "10.134.151.45"
  port: 1026
  username: "rtbench"
  password: "rtbench"

connection:
  type: "telnet"
  # 内网地址 (从跳板机访问)
  ip: "192.168.31.203"
  port: 23
  username: "root"
  password: "root"

# [DEPRECATED] 以下FRP端口转发方式已废弃，请勿使用
# deprecated_frp:
#   ip: "10.134.151.3"
#   port: 3017

ftp:
  enabled: true
  port: 3015

deploy:
  local_binary: "../../../gongkong_rtos_bench/Debug/strip/rtos-bench"
  remote_dir: "/apps/"
  remote_binary: "rtos-bench"

test:
  commands:
    list_workloads: "/apps/hzt_gongkong_rtos_bench -L"
    test_schedule_quick: "/apps/hzt_gongkong_rtos_bench test-schedule --cycles 3"
    test_schedule_full: "/apps/hzt_gongkong_rtos_bench test-schedule --cycles 5"
    test_single: "/apps/hzt_gongkong_rtos_bench -s"
  timeout_sec: 1200

result:
  remote_path: "/tmp/rtbench_result.json"
  local_output_dir: "./results/gongkong/"
  retrieval_method: "terminal_capture"

