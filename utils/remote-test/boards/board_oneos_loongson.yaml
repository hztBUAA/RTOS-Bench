# 板卡：OneOS-龙芯（LS2K1000LA）
# 系统：OneOS    架构：loongarch64
# 网络：192.168.137.213（原内网 192.168.31.213）
# 状态：未验证。模块名、运行命令、日志通道均待现场确认。
#       确认后替换 command 中的 CHANGE_ME，并补全结果打印与结束标记。

board:
  name: "OneOS-龙芯"
  os: "OneOS"
  arch: "loongarch64"

connection:
  type: "telnet"
  ip: "192.168.137.213"
  port: 23
  username: "root"
  password: "root"

deploy:
  remote_dir: "/user"

test:
  command: "ld /user/CHANGE_ME.out"
  end_regex: "\\nRT-JSON-END\\r?\\n"
  timeout_sec: 3600

result:
  remote_path: "/user/rtbench_result.json"
  local_output_dir: "./results/oneos_loongson/"
  retrieval_method: "terminal_capture"
  run_flatten: false
  run_score: false
