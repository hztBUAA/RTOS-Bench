# RTOS-Bench Nezha (哪吒 D1) 开发板配置
board:
  name: "Nezha-D1"
  os: "SylixOS"
  arch: "riscv64"
  cpu: "Allwinner D1 (C906 @ 1.0GHz)"
  description: "哪吒 RISC-V 64 开发板"

# 正确的连接方式: 通过SSH跳板机 -> Telnet到内网
jumphost:
  host: "10.134.151.45"
  port: 1026
  username: "rtbench"
  password: "rtbench"

connection:
  type: "telnet"
  # 内网地址 (从跳板机访问)
  ip: "192.168.31.202"
  port: 23
  username: "root"
  password: "root"

# [DEPRECATED] 以下FRP端口转发方式已废弃，请勿使用
# deprecated_frp:
#   ip: "10.134.151.3"
#   port: 3014

ftp:
  enabled: true
  port: 3012

deploy:
  local_binary: "../../../nezha-rtos-bench/Debug/strip/rtos-bench"
  remote_dir: "/apps/"
  remote_binary: "rtos-bench"

test:
  commands:
    list_workloads: "/apps/nezha-rtos-bench -L"
    test_schedule_quick: "/apps/nezha-rtos-bench test-schedule --cycles 3"
    test_schedule_full: "/apps/nezha-rtos-bench test-schedule --cycles 5"
    test_single: "/apps/nezha-rtos-bench -s"
  timeout_sec: 1200

result:
  remote_path: "/tmp/rtbench_result.json"
  local_output_dir: "./results/nezha/"
  retrieval_method: "terminal_capture"

