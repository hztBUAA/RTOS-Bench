# RTOS-Bench 龙芯 (LS2K1000LA) 开发板配置
board:
  name: "Loongson-LS2K1000"
  os: "SylixOS"
  arch: "loongarch"
  cpu: "Loongson LS2K1000LA"
  ram: "1.7GB"
  description: "龙芯 LoongArch 开发板"

# 正确的连接方式: 通过SSH跳板机 -> Telnet到内网
jumphost:
  host: "10.134.151.45"
  port: 1026
  username: "rtbench"
  password: "rtbench"

connection:
  type: "telnet"
  # 内网地址 (从跳板机访问)
  ip: "192.168.31.200"
  port: 23
  username: "root"
  password: "root"

# [DEPRECATED] 以下FRP端口转发方式已废弃，请勿使用
# deprecated_frp:
#   ip: "10.134.151.3"
#   port: 3008

ftp:
  enabled: true
  port: 3006

deploy:
  local_binary: "../../../loongson_rtos_bench/Debug/strip/rtos-bench"
  remote_dir: "/apps/"
  remote_binary: "rtos-bench"

test:
  commands:
    list_workloads: "/apps/rtos-bench/rtos-bench -L"
    test_schedule_quick: "/apps/rtos-bench/rtos-bench test-schedule --cycles 3"
    test_schedule_full: "/apps/rtos-bench/rtos-bench test-schedule --cycles 5"
    test_single: "/apps/rtos-bench/rtos-bench -s"
  timeout_sec: 1200

result:
  remote_path: "/tmp/rtbench_result.json"
  local_output_dir: "./results/loongson/"
  retrieval_method: "terminal_capture"

